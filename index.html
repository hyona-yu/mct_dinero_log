<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디네 | DINERO LOG</title>
<meta name="description" content="취향은 하이엔드, 지출은 합리적으로. 내집마련 · 재테크 · 결혼준비 기록.">
<meta property="og:type" content="website">
<meta property="og:title" content="디네 | DINERO LOG">
<meta property="og:description" content="취향은 하이엔드, 지출은 합리적으로">
<!-- og:image 는 base64 로는 쓸 수 없어요. 실제 이미지 파일을 올리면 절대 경로로 추가하세요. -->
<meta name="theme-color" content="#e6f0fd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="masthead">DINERO LOG</div>

  <section class="profile">
    <div class="avatar">
      <div class="avatar-inner">
        <!-- assets/img/profile.b64(이미지의 base64 텍스트)를 assets/js/avatar.js 가 디코딩해서 보여줘요. 없으면 모노그램이 보여요. -->
        <span aria-hidden="true">D</span>
        <img id="avatar-img" alt="디네 프로필" hidden>
      </div>
    </div>
    <h1 class="name">디네</h1>
    <p class="tagline">취향은 하이엔드,<br>지출은 합리적으로</p>
  </section>

  <section class="links">
    <!-- 01: 링크가 아닌 안내 문구. 인스타에서 건너온 방문자를 다시 인스타로 돌려보내지 않아요. -->
    <div class="card card-note">
      <span class="badge">01</span>
      <span class="card-body">
        <span class="card-title">릴스 자료가 궁금하다면</span>
        <span class="card-desc">팔로우하고 댓글 남기면 DM으로 보내드려요</span>
      </span>
      <span class="pill">안내</span>
    </div>

    <a class="card" href="https://m.blog.naver.com/tr_vlog" target="_blank" rel="noopener">
      <span class="badge">02</span>
      <span class="card-body">
        <span class="card-title">릴스에 다 못 담은 이야기</span>
        <span class="card-desc">블로그에 놀러오세요</span>
      </span>
      <span class="go" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </a>

    <a class="card" href="https://www.instagram.com/stories/highlights/17975779317028192/" target="_blank" rel="noopener">
      <span class="badge">03</span>
      <span class="card-body">
        <span class="card-title">신혼집 기록</span>
        <span class="card-desc">신혼집 계약부터 내집마련까지 궁금하다면?</span>
      </span>
      <span class="go" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </a>
  </section>

  <!-- 제휴 딜: 딜이 바뀌면 이 섹션의 href 와 딜 이름만 수정하세요. -->
  <section class="deal">
    <div class="deal-label">지금 받을 수 있는 웨딩 혜택</div>
    <a class="card" href="https://www.humancnt.com/deal/myu90v" target="_blank" rel="sponsored noopener">
      <span class="card-body">
        <span class="eyebrow">WEDDING BENEFIT</span>
        <span class="deal-name">더파티움안양</span>
      </span>
      <span class="cta">혜택 보기 <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </a>
    <p class="disclosure">제휴 링크로 계약하시면 수수료를 받아요.</p>
  </section>

  <footer>© DINERO LOG</footer>
</main>

<script src="assets/js/avatar.js" defer></script>

</html>
